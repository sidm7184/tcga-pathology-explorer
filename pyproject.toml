[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcga-pathology-explorer"
version = "0.1.0"
description = "A minimal CLI scaffold for exploring TCGA pathology data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
pathology-explorer = "pathology_explorer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pathology_explorer"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
